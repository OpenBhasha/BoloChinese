server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Runtime config and the app shell are rewritten on every deploy —
    # never let a browser or proxy serve a stale copy.
    location = /config.js {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
